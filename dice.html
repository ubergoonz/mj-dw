<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123f3a" />
    <title>雀起 · Dice Throw</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dice.css" />
  </head>
  <body>
    <main class="dice-shell">
      <header class="topbar">
        <a class="back-link" href="index.html" aria-label="Back to wind draw">← Back</a>
        <p class="eyebrow">MAHJONG · DICE THROW</p>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <h1 id="page-title">掷骰子</h1>
      </section>

      <section class="dice-stage" aria-live="polite">
        <div class="dice-options" role="group" aria-label="Select number of dice">
          <button class="dice-option is-active" type="button" data-count="2" aria-pressed="true">2 Dice</button>
          <button class="dice-option" type="button" data-count="3" aria-pressed="false">3 Dice</button>
        </div>

        <div class="dice-row" id="diceRow">
          <div class="die" id="dieOne" data-face="1" aria-label="First die: 1">
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
          </div>
          <div class="die" id="dieTwo" data-face="1" aria-label="Second die: 1">
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
          </div>
          <div class="die" id="dieThree" data-face="1" aria-label="Third die: 1" hidden>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
          </div>
        </div>

        <button class="roll-button" id="rollButton" type="button">
          <span class="roll-symbol">⚄</span>
          <span class="roll-label" id="rollLabel">ROLL</span>
        </button>

        <div class="result" id="result" aria-atomic="true">
          <p>Ready</p>
          <strong>Total: 2</strong>
        </div>
      </section>

      <footer class="app-footer">
        <span>Made with ❤️ by a MJ lover to MJ Community</span>
        <a
          class="footer-github"
          href="https://github.com/ubergoonz/mj-dw"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View project on GitHub"
          title="View on GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 1.5a10.5 10.5 0 0 0-3.32 20.46c.53.1.72-.22.72-.5v-1.77c-2.95.64-3.58-1.26-3.58-1.26-.49-1.23-1.18-1.56-1.18-1.56-.97-.65.07-.64.07-.64 1.07.08 1.64 1.09 1.64 1.09.95 1.63 2.5 1.15 3.11.88.1-.7.37-1.16.67-1.43-2.35-.26-4.82-1.17-4.82-5.2 0-1.15.41-2.1 1.08-2.84-.11-.27-.47-1.35.1-2.8 0 0 .88-.28 2.88 1.08a9.97 9.97 0 0 1 5.25 0c2-1.36 2.88-1.08 2.88-1.08.57 1.45.21 2.53.1 2.8.67.74 1.08 1.69 1.08 2.84 0 4.04-2.48 4.94-4.84 5.2.38.33.72.98.72 1.98v2.94c0 .28.19.6.72.5A10.5 10.5 0 0 0 12 1.5Z"
            />
          </svg>
          <span>View on<br />GitHub</span>
        </a>
        <a href="https://ko-fi.com/lesliewang" target="_blank" rel="noopener noreferrer">
          <img
            src="https://storage.ko-fi.com/cdn/kofi3.png?v=3"
            alt="Buy Me a Coffee at ko-fi.com"
            style="border:0; height:36px;"
          />
        </a>
      </footer>
    </main>

    <script src="dice.js"></script>
  </body>
</html>
