<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123f3a" />
    <title>雀起 · 定风位</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-10K04D2J2B"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-10K04D2J2B');
    </script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">雀</span>
            <a href="./index.html" aria-label="重新加载页面">雀起</a>
        </div>
        <div class="topbar-actions">
          <a class="icon-link" href="dice.html" aria-label="Open dice throw page" title="Dice Throw">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm3.5 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm7 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm-7 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm7-7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z" />
            </svg>
          </a>
          <button class="icon-button" type="button" aria-label="查看规则">
            <span>?</span>
          </button>
        </div>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">MAHJONG · SEAT DRAW</p>
        <h1 id="page-title">定风位</h1>
        <p>一掷定乾坤，<br />谁来坐庄？</p>
      </section>

      <section class="wind-stage" aria-live="polite">
        <div class="compass" id="compass">
          <span class="card card-east">
            <span class="card-inner">
              <span class="tile-face tile-back" aria-hidden="true"></span>
              <span class="tile-face tile-front"></span>
            </span>
          </span>
          <span class="card card-south">
            <span class="card-inner">
              <span class="tile-face tile-back" aria-hidden="true"></span>
              <span class="tile-face tile-front"></span>
            </span>
          </span>
          <span class="card card-west">
            <span class="card-inner">
              <span class="tile-face tile-back" aria-hidden="true"></span>
              <span class="tile-face tile-front"></span>
            </span>
          </span>
          <span class="card card-north">
            <span class="card-inner">
              <span class="tile-face tile-back" aria-hidden="true"></span>
              <span class="tile-face tile-front"></span>
            </span>
          </span>
          <button class="center-tile" id="drawButton" type="button" aria-label="开始抽风">
            <span class="tile-symbol">發</span>
            <span class="tile-label" id="buttonLabel">开始</span>
          </button>
        </div>
        <div class="result" id="result" aria-atomic="true">
          <p>准备就绪</p>
          <strong>点击發开始抽风</strong>
        </div>
      </section>

      <footer class="app-footer">
        <span>Made with ❤️ by a MJ lover to MJ Community</span>
        <a
          class="footer-github"
          href="https://github.com/ubergoonz/mj-dw"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View project on GitHub"
          title="View on GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 1.5a10.5 10.5 0 0 0-3.32 20.46c.53.1.72-.22.72-.5v-1.77c-2.95.64-3.58-1.26-3.58-1.26-.49-1.23-1.18-1.56-1.18-1.56-.97-.65.07-.64.07-.64 1.07.08 1.64 1.09 1.64 1.09.95 1.63 2.5 1.15 3.11.88.1-.7.37-1.16.67-1.43-2.35-.26-4.82-1.17-4.82-5.2 0-1.15.41-2.1 1.08-2.84-.11-.27-.47-1.35.1-2.8 0 0 .88-.28 2.88 1.08a9.97 9.97 0 0 1 5.25 0c2-1.36 2.88-1.08 2.88-1.08.57 1.45.21 2.53.1 2.8.67.74 1.08 1.69 1.08 2.84 0 4.04-2.48 4.94-4.84 5.2.38.33.72.98.72 1.98v2.94c0 .28.19.6.72.5A10.5 10.5 0 0 0 12 1.5Z"
            />
          </svg>
          <span>View on<br />GitHub</span>
        </a>
        <a href="https://ko-fi.com/lesliewang" target="_blank" rel="noopener noreferrer">
        <img 
          src="https://storage.ko-fi.com/cdn/kofi3.png?v=3" 
          alt="Buy Me a Coffee at ko-fi.com" 
          style="border:0; height:36px;" 
        />
        </a>
      </footer>

    </main>

    <dialog class="rules-dialog" id="rulesDialog">
      <div class="dialog-content">
        <button class="close-button" id="closeRules" type="button" aria-label="关闭">×</button>
        <p class="eyebrow">HOW TO PLAY</p>
        <h2>定风位</h2>
        <p>点击“开始抽风”，系统会随机抽取东、南、西、北四个风位。</p>
        <p>抽到<strong>东风</strong>的玩家为本局庄家。</p>
      </div>
    </dialog>

    <script src="app.js"></script>
  
  </body>
</html>
